services:
  ktbtracker_server:
    image: ktbtracker-server
    volumes:
      - /Users/daviduczen/Downloads/ktbtracker-firebase-adminsdk-fbsvc-5c902dfe43.json:/etc/secrets/gcp-credentials.json:ro
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 3306
      DATABASE_TYPE: mysql+pymysql
      GOOGLE_APPLICATION_CREDENTIALS: /etc/secrets/gcp-credentials.json
    depends_on:
      - database

  database:
    image: mysql:8.0
    extra_hosts: [ 'host.docker.internal:8000' ]
    env_file:
      - .env
    volumes:
      - database:/var/lib/mysql
    ports:
      - 3306:3306

volumes:
  database:
    driver: local
