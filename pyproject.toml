[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ktbtracker-server"
description = ""
version = "1.0.0"
authors = [
    {name = "daviduczen-b14",email = "david.uczen@bayfourteen.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django",
    "django-environ",
    "gunicorn",
    "mysqlclient",
    "uvicorn",
    "uvicorn-worker"
]

[project.optional-dependencies]
dev = [
    "coverage (>=7.12.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "tox (>=4.32.0,<5.0.0)"
]

[tool.hatch.version]
path = "src/__init__.py"

[tool.pytest.ini_options]
addopts = "--junitxml=./xunit-result-report.xml"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s ($(filename)s:%(lineno)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
