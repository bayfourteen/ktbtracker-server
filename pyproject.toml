[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "ktbtracker-server"
description = ""
authors = [
    {name = "daviduczen-b14",email = "david.uczen@bayfourteen.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "jinja2 (>=3.1.6,<4.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "fastapi (>=0.121.3,<0.122.0)",
    "fastapi-decorators (>=1.0.19,<2.0.0)",
    "firebase-admin (>=7.1.0,<8.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "sqlmodel (>=0.0.27,<0.0.28)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "python-ulid (>=3.1.0,<4.0.0)",
    "babel (>=2.17.0,<3.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)"
]

[dependency-groups]
dev = [
    "coverage (>=7.12.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "tox (>=4.32.0,<5.0.0)"
]

[tool.poetry]
package-mode = false
version = "0.1.0"

[tool.poetry-dynamic-versioning]
enable = true

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.pytest.ini_options]
addopts = "--junitxml=./xunit-result-report.xml"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s ($(filename)s:%(lineno)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
