{% load bootstrap5 %}
{% load static %}
{% load core_filters %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ _('King Tiger Black Belt Cycle') }}</title>
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" sizes="32x32">
    <link rel="icon" href="{{ url_for('static', path='icon.svg') }}" type="image/svg+xml">
    {
    % bootstrap_css %}
    }
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="{{ url_for('static', path='/css/style.css') }}" rel="stylesheet">
{% for lang in settings.supported_locales %}
    <link href="{{ request.url | for_locale(locale=lang) }}" hreflang="{{ lang }}" rel="alternate">
{% endfor %}
    <script src="{{ url_for('static', path='/js/color-modes.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body class="{{ page_background or 'bg-body-tertiary' }}">
{% include '_layout/header.html' %}
<main class="container">
    {% block content %}{% endblock content %}
</main>
{% bootstrap_javascript %}
</body>
</html>
