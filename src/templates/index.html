{% extends "base.html" %}

{% block content %}
      <div class="my-3 p-3 bg-body rounded shadow-sm">
        <h6 class="border-bottom pb-2 mb-0">{{ _('Cycles') }}</h6>
  {% for cycle in cycles %}
        <div class="d-flex text-body-secondary pt-3">
          <svg
            aria-label="Placeholder: 32x32"
            class="bd-placeholder-img flex-shrink-0 me-2 rounded"
            height="32"
            preserveAspectRatio="xMidYMid slice"
            role="img"
            width="32"
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>{{ cycle.title }}r</title>
            <rect width="100%" height="100%" fill="#007bff"></rect>
            <text x="50%" y="50%" fill="#007bff" dy=".3em">32x32</text>
          </svg>
          <div class="pb-3 mb-0 small lh-sm border-bottom w-100">
            <div class="d-flex justify-content-between">
              <strong class="text-gray-dark">{{ cycle.title }}</strong>
              <a href="#">{{ _('Candidates') }}</a>
            </div>
            <span class="d-block">{{ cycle.cycle_start | format_date(format='long') }} - {{ cycle.cycle_end | format_date(format='long') }}</span>
          </div>
        </div>
  {% endfor %}
        <small class="d-block text-end mt-3">
          <a href="#">{{ _('All suggestions') }}</a>
        </small>
      </div>
{% endblock %}
