{% load i18n l10n static ktbtracker_tags %}
<div class="col-auto" hx-get="{% url 'candidates:index' %}{% querystring %}"
     hx-target="this" hx-trigger="load" hx-swap="innerHTML">
    {% partialdef candidate-selector %}
        <select name="canid" class="form-select" aria-label="{% trans 'Select a candidate' %}" onchange="this.form.submit()">
            <option{% if not selected_user %} selected{% endif %} value="">{% trans 'Select a candidate' %}</option>
            {% for candidate in candidates %}
                <option{% if selected_canid == candidate.id|unlocalize %} selected{% endif %}
                                                                    value="{{ candidate.id|unlocalize }}">
                    {{ candidate.user.first_name|capfirst }}{% if candidate.user.last_name %} {{ candidate.user.last_name|capfirst|slice:1 }}
                        .{% endif %}
                </option>
            {% endfor %}
        </select>
    {% endpartialdef candidate-selector %}
</div>
