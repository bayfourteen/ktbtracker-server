{% load i18n l10n static %}
<div class="col">
    {% partialdef user-selector inline %}
        <select name="cycle" class="form-select" aria-label="{% trans 'Select a cycle' %}"
                onchange="this.form.submit()">
            <option{% if not selected_cycle %} selected{% endif %} value="">{% trans 'Select a cycle' %}</option>
            {% for cycle in cycles %}
                <option{% if selected_cycle == cycle.id|unlocalize %} selected{% endif %}
                                                                      value="{{ cycle.id|unlocalize }}">
                    {{ cycle.title }}
                </option>
            {% endfor %}
        </select>
    {% endpartialdef user-selector %}
</div>
